<!DOCTYPE html>
<html lang="vi">
<head>
 <meta charset="UTF-8">
 <meta name="viewport" content="width=device-width, initial-scale=1.0">
 <link rel="icon" href="data:,">
 <title>VSTEP Speaking Part 01</title>
 
 <!-- Tải Tailwind CSS -->
 <script src="https://cdn.tailwindcss.com"></script>
 
 <!-- Tải Google Fonts (Roboto Serif) -->
 <link rel="preconnect" href="https://fonts.googleapis.com">
 <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
 <link href="https://fonts.googleapis.com/css2?family=Roboto+Serif:ital,opsz,wght@0,8..144,100..900;1,8..144,100..900&display=swap" rel="stylesheet">

 <!-- Cấu hình Tailwind CSS với Font Family & Font Size lớn hơn, đồng nhất -->
 <script>
 tailwind.config = {
 theme: {
 extend: {
 fontFamily: {
 sans: ['"Roboto Serif"', 'Georgia', 'Cambria', '"Times New Roman"', 'Times', 'serif'],
 serif: ['"Roboto Serif"', 'Georgia', 'Cambria', '"Times New Roman"', 'Times', 'serif'],
 }
 }
 }
 }
 </script>
 
 <!-- Tải React và ReactDOM -->
 <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
 <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
 
 <!-- Tải Babel để trình duyệt hiểu được code JSX của React -->
 <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

 <style>
 @keyframes fadeIn {
 from { opacity: 0; transform: translateY(10px); }
 to { opacity: 1; transform: translateY(0); }
 }
 .animate-fade-in {
 animation: fadeIn 0.3s ease-out forwards;
 }
 body { 
 font-family: 'Roboto Serif', Georgia, Cambria, "Times New Roman", Times, serif;
 font-weight: 300;
 font-size: 18px;
 line-height: 1.5;
 }
 p, span, div, h1, h2, h3, h4, h5, h6, button, li, a {
 line-height: 1.5 !important;
 }
 @media (min-width: 1280px) {
 .wh-formula-grid {
 grid-template-columns: minmax(300px, 0.92fr) minmax(0, 1.08fr) !important;
 }
 }
 </style>
</head>
<body class="bg-slate-50 text-slate-900">
 <div id="root"></div>

 <script src="./data/group1.js"></script>
 <script src="./data/group2.js"></script>
 <script src="./data/group3.js"></script>
 <script src="./data/group4.js"></script>
 <script src="./data/group5.js"></script>
 <script src="./data/group6.js"></script>
 <script src="./data/group7.js"></script>
 <script src="./data/group8.js"></script>

<script>
  Babel.registerPreset('react-classic', {
    presets: [
      [Babel.availablePresets['react'], { runtime: 'classic' }]
    ]
  });
</script>
<script type="text/babel" data-presets="react-classic" src="./app.js"></script>
</body>
</html>
